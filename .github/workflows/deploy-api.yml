name: Deploy photo service
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
        working-directory: backend
      - name: Configure Cloudflare binding
        working-directory: backend
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          test -n "$D1_DATABASE_ID" || { echo 'D1_DATABASE_ID secret missing'; exit 1; }
          python - <<'PY'
          import json, os
          from pathlib import Path
          config = json.loads(Path('wrangler.jsonc').read_text())
          config['d1_databases'][0]['database_id'] = os.environ['D1_DATABASE_ID']
          Path('wrangler.deploy.json').write_text(json.dumps(config))
          PY
      - name: Migrate, set review key and deploy
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_TOKEN: ${{ secrets.WEPA_ADMIN_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$ADMIN_TOKEN" || { echo 'Cloudflare credentials or WEPA_ADMIN_TOKEN missing'; exit 1; }
          npx wrangler d1 migrations apply wepa-new-heights-db --remote --config wrangler.deploy.json
          printf '%s' "$ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN --config wrangler.deploy.json
          npx wrangler deploy --config wrangler.deploy.json
